services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # network_mode: host → container pakai network stack host,
    # sehingga localhost:11434 (Ollama) bisa dijangkau tanpa bind 0.0.0.0
    network_mode: host
    environment:
      CSV_FILE_PATH: /app/data/applications.csv
      CSV_TEMPLATES_PATH: /app/data/templates.csv
      PROFILE_FILE_PATH: /app/data/profile.json
      CONTEXT_FILE_PATH: /app/data/context.md
      OLLAMA_URL: "http://127.0.0.1:11434"
      PORT: "8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
